[project]
name = "duckietown-new-version"
version = "0.1.0"
# 3.10 = Python del contenedor del robot (dt-ros-commons ente / Ubuntu 22.04).
# 3.9 quedo EOL (oct-2025). Las herramientas bare-metal del host Jetson (JetPack 4.6,
# Python 3.6) son scripts aparte, escritos compatibles con 3.6.
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [
  "training",
  "perception/packages/object_detection/src",
  "planning/packages/duckietown_planning/src",
  "simulation",
  "control",
  "diagnostics",
  "rl",
  "platform_support",
]
testpaths = ["training/tests", "perception/tests", "planning/tests", "simulation/tests", "control/tests", "diagnostics/tests", "rl/tests", "platform_support/tests", "bringup/tests"]

[tool.ruff]
extend-exclude = [".venv"]

[tool.ruff.lint]
# Enforcamos la familia F (pyflakes): nombres indefinidos, imports/variables sin
# usar -> errores REALES (esto cazo un bug real: ctrl_last_turn usado sin inicializar
# en sim_mission). Ignoramos los E cosmeticos/intencionales de este repo:
#   E402: los CLIs en tools/ hacen sys.path.insert ANTES de importar (deliberado);
#   E701/E702/E731/E741: estilo (one-liners, lambdas, nombre 'l'), no son bugs.
# El conjunto de reglas se fija a mano: sin esto, cada version de ruff trae sus
# propios valores por defecto y el CI (ruff sin fijar) deja de coincidir con local.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E701", "E702", "E731", "E741"]
