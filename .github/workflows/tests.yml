# .github/workflows/tests.yml
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv (gestor moderno)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Crear venv e instalar dependencias (uv)
        run: |
          uv venv
          uv pip install -r requirements-dev.txt
      - name: Correr tests
        run: uv run pytest -q

  docker-dev:
    name: dev container (Docker + uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen dev (uv) y correr la suite en contenedor
        run: docker build -f Dockerfile.dev -t dt-newver-dev . && docker run --rm dt-newver-dev
