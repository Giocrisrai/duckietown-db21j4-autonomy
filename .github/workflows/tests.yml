# .github/workflows/tests.yml
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.10 = Python del contenedor del robot (dt-ros-commons ente, Ubuntu 22.04);
        # 3.13 = entorno de desarrollo. Asi se cubre todo el rango de despliegue.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar uv + dependencias (uv como instalador rapido)
        run: |
          pip install uv
          uv pip install --system -r requirements-dev.txt
      - name: Correr tests
        run: python -m pytest -q

  docker-dev:
    name: dev container (Docker + uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen dev (uv) y correr la suite en contenedor
        run: docker build -f Dockerfile.dev -t dt-newver-dev . && docker run --rm dt-newver-dev
